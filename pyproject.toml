[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-agent"
version = "0.1.0"
description = "Local-first personal AI assistant runtime with coding, memory, lifelog, and presence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kairos = "kairos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
