[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-agent"
version = "0.1.0"
description = "Local-first personal AI assistant runtime with coding, memory, lifelog, and presence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136,<1.0",
  "uvicorn>=0.47,<1.0",
]

[project.scripts]
kairos = "kairos.cli:main"
kairos-app = "kairos.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
